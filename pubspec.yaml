name: Flumi
description: "Déjate llevar por la corriente."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Base de datos local offline-first (SQLite vía Drift) ---
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- Backend / nube ---
  supabase_flutter: ^2.5.6

  # --- Notificaciones push (FCM) y locales ---
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^19.2.0

  # --- Conectividad ---
  connectivity_plus: ^6.0.3

  # --- HTTP para servidor local ---
  http: ^1.2.0

  # --- Abrir URL de descarga (actualización obligatoria) ---
  url_launcher: ^6.3.1

  # --- Identificadores únicos generados en cliente ---
  uuid: ^4.4.0

  # --- Mapas offline-friendly (OSM, sin Google Maps) ---
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # --- Persistencia simple ---
  shared_preferences: ^2.2.3

  # --- Versión/build real del paquete (actualización obligatoria) ---
  package_info_plus: ^10.2.1

  # --- UI ---
  cupertino_icons: ^1.0.6
  curved_navigation_bar: ^1.0.6
  flutter_svg: ^2.0.10
  swipe_cards:
    path: packages/swipe_cards

  # --- Cámara / galería ---
  image_picker: ^1.1.2
  # --- Cámara frontal embebida (verificación en vivo) ---
  camera: ^0.12.1
  permission_handler: ^11.4.0

  # --- Verificación de perfil (reconocimiento facial on-device, FaceNet) ---
  face_verification: ^0.3.9

  # --- Reconocimiento de gesto (prueba de vida on-device, MediaPipe/LiteRT) ---
  hand_detection: ^4.1.0

  # --- Procesado de imágenes (recorte, formato, compresión) ---
  image: ^4.8.0
  crop_your_image:
    path: packages/crop_your_image

  # --- Georreferencia ---
  geolocator: ^13.0.1

  # --- SMS (verificación automática de pagos) ---
  # Fork local de telephony 0.2.0 (discontinuado): migrado a Built-in Kotlin
  # para eliminar el warning KGP. API Dart idéntica al original.
  telephony:
    path: packages/telephony

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.2
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/images/gestos/
    - assets/data/
    - assets/icons/
    - assets/onboarding/
    # NOTA: assets/fotos_prueba/ NO se empaqueta (10+ MB de fotos de test
    # sin referencia en código). Quedan en disco para uso manual.
